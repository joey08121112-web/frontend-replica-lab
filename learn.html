<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apple 复刻前端课 · 交互式学习平台</title>
<meta name="description" content="交互式前端学习平台：Learn → Try → Run → See → Think → Debug → Compare → Pass，全部在一个页面里完成。">
<link rel="stylesheet" href="css/learn.css">
</head>
<body>
<a class="skip" href="#stageView">跳到课程内容</a>

<aside class="sidebar" id="sidebar" aria-label="课程目录">
  <div class="side-head">
    <div class="side-logo">◐</div>
    <div>
      <div class="side-title">Apple 复刻前端课</div>
      <div class="side-sub">Guided → Assisted → Independent</div>
    </div>
  </div>
  <nav id="sideNav" class="side-nav"><!-- JS 渲染 --></nav>
  <div class="side-foot">
    <button class="ghost-btn small" data-action="reset-progress">Reset All Progress</button>
    <p class="side-note">进度保存在本机浏览器<br>Markdown 教案仅作内容存档</p>
  </div>
</aside>
<div class="scrim" id="scrim" hidden></div>

<div class="main">
  <header class="topbar">
    <button id="menuBtn" class="icon-btn" aria-label="打开课程目录">☰</button>
    <div class="crumbs" id="crumbs"></div>
    <div class="top-progress" aria-label="总学习进度">
      <div class="bar"><i id="progFill"></i></div>
      <span class="prog-text" id="progText"></span>
    </div>
    <div class="search">
      <input id="searchInput" type="search" placeholder="搜索：section / viewport / flex…" autocomplete="off" aria-label="搜索课程知识点">
      <div id="searchResults" class="search-results" hidden></div>
    </div>
  </header>

  <main id="stageView" class="content" tabindex="-1"><!-- JS 渲染 --></main>

  <footer class="pager" id="pager"><!-- JS 渲染 --></footer>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="js/data.js"></script>
<script src="js/final-page.js"></script>
<script src="js/learn.js"></script>
<script>
/* 在线演示版权降级：本地学习版此处为 Apple 官网参考截图（仅限本地学习），公开部署版按版权要求未收录，
   降级为引导卡片——去 Apple 官网观察真实页面本就是该环节的教学意图。 */
(function(){
  var st = document.createElement('style');
  st.textContent = '.ref-fallback{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:200px;margin:12px 0;border:1px dashed rgba(128,128,145,.45);border-radius:14px;background:rgba(120,120,140,.07);color:inherit;text-decoration:none;padding:28px 20px;text-align:center;transition:border-color .2s}.ref-fallback:hover{border-color:rgba(128,128,145,.9)}.rf-eye{font-size:26px;line-height:1}.rf-t1{font-size:15px;font-weight:600}.rf-t2{font-size:13px;opacity:.62}';
  document.head.appendChild(st);
  function toCard(img){
    if (img.dataset.refFb) return; img.dataset.refFb = '1';
    var a = document.createElement('a');
    a.className = 'ref-fallback';
    a.href = 'https://www.apple.com.cn/iphone/';
    a.target = '_blank'; a.rel = 'noopener noreferrer';
    a.innerHTML = '<span class="rf-eye">\u2197</span><span class="rf-t1">\u5728\u7ebf\u6f14\u793a\u7248\u672a\u6536\u5f55 Apple \u5b98\u7f51\u53c2\u8003\u622a\u56fe</span><span class="rf-t2">\u70b9\u51fb\u524d\u5f80 Apple \u5b98\u7f51\u89c2\u5bdf\u771f\u5b9e\u9875\u9762\u2014\u2014\u8fd9\u6b63\u662f\u672c\u73af\u8282\u7684\u6559\u5b66\u610f\u56fe</span>';
    img.replaceWith(a);
  }
  document.addEventListener('error', function(e){
    var t = e.target;
    if (t && t.tagName === 'IMG' && (t.getAttribute('src')||'').indexOf('curriculum/reference/') === 0) toCard(t);
  }, true);
})();
</script>
</body>
</html>
