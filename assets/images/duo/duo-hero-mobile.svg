<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-label="Mobile hero banner with a single folded iPhone Duo standing upright in the lower half of a deep night-blue gradient with faint stars, empty space above for a headline">
  <title>iPhone Duo — mobile hero</title>
  <defs>
    <linearGradient id="bgM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="0.6" stop-color="#142031"/>
      <stop offset="1" stop-color="#1b2536"/>
    </linearGradient>
    <radialGradient id="glowM" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#33456b" stop-opacity="0.45"/>
      <stop offset="0.55" stop-color="#22304d" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#22304d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="floorGlowM" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2e4066" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#2e4066" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hBodyM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c3b56"/>
      <stop offset="0.5" stop-color="#1a2332"/>
      <stop offset="1" stop-color="#0f1727"/>
    </linearGradient>
    <linearGradient id="rimM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0e2b8" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#c8b88a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7f8db0" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="sheenM" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hingeM" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5d6d90"/>
      <stop offset="0.45" stop-color="#28324a"/>
      <stop offset="0.8" stop-color="#4a5a7c"/>
      <stop offset="1" stop-color="#1a2334"/>
    </linearGradient>
    <linearGradient id="scrM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1526"/>
      <stop offset="0.6" stop-color="#070b14"/>
      <stop offset="1" stop-color="#04060c"/>
    </linearGradient>
    <linearGradient id="islM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2a45"/>
      <stop offset="1" stop-color="#0b111e"/>
    </linearGradient>
    <radialGradient id="ringM2" cx="0.35" cy="0.3" r="0.95">
      <stop offset="0" stop-color="#93a4c4"/>
      <stop offset="0.55" stop-color="#4a5a7c"/>
      <stop offset="1" stop-color="#232e46"/>
    </radialGradient>
    <radialGradient id="glassM" cx="0.35" cy="0.3" r="0.95">
      <stop offset="0" stop-color="#55688c"/>
      <stop offset="0.55" stop-color="#16202f"/>
      <stop offset="1" stop-color="#04060c"/>
    </radialGradient>
    <clipPath id="scrMClip">
      <rect x="22" y="138" width="296" height="568" rx="27"/>
    </clipPath>
    <linearGradient id="fadeRefM" x1="0" y1="1140" x2="0" y2="1290" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="refMaskM">
      <rect x="240" y="1140" width="420" height="150" fill="url(#fadeRefM)"/>
    </mask>

    <!-- folded Duo, front view, 340 x 730 -->
    <g id="devFrontM">
      <rect x="8" y="8" width="340" height="730" rx="52" fill="#03060c"/>
      <rect x="-4" y="-4" width="348" height="738" rx="56" fill="none" stroke="#e9dcb4" stroke-width="6" opacity="0.12"/>
      <rect x="0" y="0" width="340" height="730" rx="52" fill="url(#hBodyM)"/>
      <rect x="0" y="0" width="340" height="730" rx="52" fill="url(#sheenM)"/>
      <rect x="0" y="0" width="340" height="730" rx="52" fill="none" stroke="url(#rimM)" stroke-width="2"/>
      <rect x="322" y="18" width="13" height="694" rx="6.5" fill="url(#hingeM)"/>
      <rect x="322" y="340" width="13" height="5" fill="#0d1422" opacity="0.8"/>
      <rect x="322" y="560" width="13" height="5" fill="#0d1422" opacity="0.8"/>
      <rect x="336" y="24" width="2" height="682" fill="#e9dcb4" opacity="0.25"/>
      <rect x="-5.5" y="300" width="6" height="52" rx="3" fill="#0b1322" stroke="#33425c" stroke-width="0.6"/>
      <rect x="-5.5" y="368" width="6" height="52" rx="3" fill="#0b1322" stroke="#33425c" stroke-width="0.6"/>
      <rect x="-5.5" y="446" width="6" height="84" rx="3" fill="#0b1322" stroke="#33425c" stroke-width="0.6"/>
      <rect x="22" y="22" width="100" height="100" rx="30" fill="url(#islM)" stroke="#465a7c" stroke-width="1"/>
      <circle cx="54" cy="74" r="19" fill="url(#ringM2)"/>
      <circle cx="54" cy="74" r="13.5" fill="#070b13"/>
      <circle cx="54" cy="74" r="10" fill="url(#glassM)"/>
      <circle cx="98" cy="74" r="19" fill="url(#ringM2)"/>
      <circle cx="98" cy="74" r="13.5" fill="#070b13"/>
      <circle cx="98" cy="74" r="10" fill="url(#glassM)"/>
      <circle cx="76" cy="42" r="8" fill="#e8ddb8" opacity="0.2"/>
      <circle cx="76" cy="42" r="4.5" fill="#e8ddb8" opacity="0.85"/>
      <rect x="22" y="138" width="296" height="568" rx="27" fill="url(#scrM)"/>
      <rect x="23" y="139" width="294" height="566" rx="26" fill="none" stroke="#223050" stroke-width="1" opacity="0.55"/>
      <circle cx="170" cy="162" r="6" fill="#02040a" stroke="#1a2436" stroke-width="1"/>
      <g clip-path="url(#scrMClip)">
        <circle cx="90" cy="250" r="1.3" fill="#cfe0ff" opacity="0.4"/>
        <circle cx="250" cy="230" r="1.1" fill="#cfe0ff" opacity="0.3"/>
        <circle cx="140" cy="420" r="1.1" fill="#cfe0ff" opacity="0.25"/>
        <circle cx="270" cy="480" r="1.3" fill="#cfe0ff" opacity="0.3"/>
        <path d="M22,706 L96,624 L160,668 L226,600 L318,706 Z" fill="#2c3f63" opacity="0.55"/>
        <path d="M22,706 L120,650 L196,690 L318,706 Z" fill="#1e2e4e" opacity="0.6"/>
      </g>
      <text x="170" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="600" letter-spacing="1" fill="#eef3fb">09:41</text>
      <text x="170" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" letter-spacing="3" fill="#8b9bb8">MON SEP 28</text>
      <rect x="130" y="688" width="80" height="4.5" rx="2.25" fill="#8fa2c2" opacity="0.5"/>
    </g>
  </defs>

  <!-- night background -->
  <rect width="900" height="1200" fill="url(#bgM)"/>
  <ellipse cx="450" cy="810" rx="430" ry="360" fill="url(#glowM)"/>

  <!-- stars -->
  <g fill="#cfe0ff">
    <circle cx="70" cy="90" r="1.3" opacity="0.38"/>
    <circle cx="160" cy="220" r="0.9" opacity="0.22"/>
    <circle cx="240" cy="130" r="1.5" opacity="0.42"/>
    <circle cx="330" cy="60" r="1" opacity="0.25"/>
    <circle cx="410" cy="270" r="1.1" opacity="0.2"/>
    <circle cx="470" cy="120" r="0.8" opacity="0.18"/>
    <circle cx="540" cy="200" r="1.6" opacity="0.45"/>
    <circle cx="620" cy="70" r="0.9" opacity="0.2"/>
    <circle cx="700" cy="150" r="1.3" opacity="0.35"/>
    <circle cx="790" cy="60" r="0.8" opacity="0.15"/>
    <circle cx="830" cy="240" r="1.1" opacity="0.28"/>
    <circle cx="110" cy="330" r="1" opacity="0.2"/>
    <circle cx="190" cy="430" r="1.2" opacity="0.26"/>
    <circle cx="340" cy="380" r="0.8" opacity="0.14"/>
    <circle cx="60" cy="520" r="1" opacity="0.18"/>
    <circle cx="280" cy="560" r="0.9" opacity="0.14"/>
    <circle cx="460" cy="320" r="1" opacity="0.2"/>
    <circle cx="600" cy="360" r="0.8" opacity="0.15"/>
    <circle cx="740" cy="320" r="1" opacity="0.18"/>
    <circle cx="840" cy="420" r="0.8" opacity="0.14"/>
    <circle cx="90" cy="640" r="0.9" opacity="0.14"/>
    <circle cx="170" cy="740" r="0.8" opacity="0.12"/>
    <circle cx="810" cy="560" r="0.9" opacity="0.13"/>
    <circle cx="850" cy="700" r="0.8" opacity="0.11"/>
    <circle cx="60" cy="880" r="0.8" opacity="0.11"/>
    <circle cx="120" cy="1020" r="0.8" opacity="0.1"/>
    <circle cx="820" cy="860" r="0.8" opacity="0.1"/>
  </g>
  <path d="M240 122v16M232 130h16" stroke="#dfe9ff" stroke-width="1.3" opacity="0.5" stroke-linecap="round"/>
  <path d="M700 62v16M692 70h16" stroke="#dfe9ff" stroke-width="1.3" opacity="0.4" stroke-linecap="round"/>
  <path d="M540 192v12M534 198h12" stroke="#dfe9ff" stroke-width="1.2" opacity="0.45" stroke-linecap="round"/>

  <!-- floor -->
  <ellipse cx="450" cy="1140" rx="390" ry="64" fill="url(#floorGlowM)"/>

  <!-- reflection -->
  <g mask="url(#refMaskM)">
    <use href="#devFrontM" transform="translate(280,1870) scale(1,-1)" opacity="0.5"/>
  </g>

  <!-- standing device -->
  <use href="#devFrontM" transform="translate(280,410)"/>

  <!-- contact shadow -->
  <ellipse cx="450" cy="1146" rx="190" ry="15" fill="#03060c" opacity="0.55"/>
  <ellipse cx="450" cy="1150" rx="330" ry="22" fill="#03060c" opacity="0.3"/>
</svg>
