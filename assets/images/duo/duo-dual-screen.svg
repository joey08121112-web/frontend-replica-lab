<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="iPhone Duo fully open seen from slightly above, the inner display split by the fold crease into a map app on the left and a messaging app on the right">
  <title>iPhone Duo — dual-screen multitasking</title>
  <defs>
    <linearGradient id="dBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c3b56"/>
      <stop offset="0.55" stop-color="#1a2332"/>
      <stop offset="1" stop-color="#0f1727"/>
    </linearGradient>
    <linearGradient id="dScreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1424"/>
      <stop offset="1" stop-color="#060a12"/>
    </linearGradient>
    <linearGradient id="dCrease" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <clipPath id="dMapClip">
      <path d="M246,200 L596,200 L596,676 L216,676 Q200,676 201,662 L231,214 Q232,200 246,200 Z"/>
    </clipPath>
    <clipPath id="dMsgClip">
      <path d="M604,200 L954,200 Q968,200 969,214 L999,662 Q1000,676 984,676 L604,676 Z"/>
    </clipPath>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="600" cy="762" rx="470" ry="26" fill="#0f1726" opacity="0.15"/>
  <ellipse cx="600" cy="758" rx="360" ry="18" fill="#0f1726" opacity="0.1"/>

  <!-- body depth -->
  <path d="M192,676 L1008,676 L1008,700 Q1008,722 984,722 L216,722 Q192,722 192,700 Z" fill="#0a101d"/>
  <!-- body -->
  <path d="M228,176 L972,176 Q992,176 993,194 L1027,682 Q1028,700 1008,700 L192,700 Q172,700 173,682 L207,194 Q208,176 228,176 Z" fill="url(#dBody)" stroke="#3c4c6a" stroke-width="1.5"/>
  <!-- inner display -->
  <path d="M246,200 L954,200 Q968,200 969,214 L999,662 Q1000,676 984,676 L216,676 Q200,676 201,662 L231,214 Q232,200 246,200 Z" fill="url(#dScreen)"/>
  <circle cx="600" cy="222" r="7" fill="#02040a" stroke="#1a2436" stroke-width="1"/>

  <!-- fold crease -->
  <rect x="596" y="200" width="8" height="476" fill="url(#dCrease)"/>
  <rect x="595" y="200" width="1.5" height="476" fill="#000000" opacity="0.22"/>
  <rect x="603.5" y="200" width="1.5" height="476" fill="#000000" opacity="0.22"/>

  <!-- left app: map -->
  <g clip-path="url(#dMapClip)">
    <rect x="190" y="190" width="414" height="496" fill="#e8eef5"/>
    <ellipse cx="250" cy="268" rx="88" ry="46" fill="#c3d9ee"/>
    <rect x="252" y="556" width="168" height="118" rx="10" fill="#cfe4c6"/>
    <line x1="196" y1="356" x2="592" y2="312" stroke="#c6d0de" stroke-width="14"/>
    <line x1="330" y1="196" x2="362" y2="676" stroke="#c6d0de" stroke-width="12"/>
    <line x1="502" y1="196" x2="470" y2="676" stroke="#c6d0de" stroke-width="9" opacity="0.85"/>
    <line x1="200" y1="470" x2="592" y2="446" stroke="#d4dde8" stroke-width="5"/>
    <line x1="430" y1="196" x2="418" y2="676" stroke="#d4dde8" stroke-width="4" opacity="0.8"/>
    <polyline points="262,640 320,560 300,470 380,420 430,330 500,300 540,250" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" opacity="0.65"/>
    <polyline points="262,640 320,560 300,470 380,420 430,330 500,300 540,250" fill="none" stroke="#3f7ae0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="262" cy="640" r="13" fill="#35c26b" stroke="#ffffff" stroke-width="4"/>
    <circle cx="540" cy="250" r="13" fill="#e0483f" stroke="#ffffff" stroke-width="4"/>
    <rect x="252" y="220" width="240" height="40" rx="13" fill="#ffffff"/>
    <circle cx="278" cy="240" r="8" fill="none" stroke="#97a3b5" stroke-width="3"/>
    <rect x="298" y="234" width="150" height="11" rx="5.5" fill="#ccd5e1"/>
    <rect x="232" y="574" width="84" height="36" rx="10" fill="#101828" opacity="0.88"/>
    <text x="274" y="598" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#e8eef5">MAP</text>
  </g>

  <!-- right app: messages -->
  <g clip-path="url(#dMsgClip)">
    <rect x="596" y="190" width="414" height="496" fill="#0f1729"/>
    <rect x="596" y="200" width="412" height="58" fill="#131e35"/>
    <path d="M622,222 l13,9 l-13,9" fill="none" stroke="#9fb2d4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="774" y="236" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#e8eef5">MSG</text>
    <circle cx="946" cy="229" r="17" fill="#3d5480"/>

    <circle cx="654" cy="330" r="26" fill="#4a5f8f"/>
    <rect x="700" y="310" width="110" height="14" rx="7" fill="#cfd9ea" opacity="0.85"/>
    <rect x="700" y="334" width="212" height="12" rx="6" fill="#7787a4" opacity="0.5"/>
    <circle cx="958" cy="314" r="4" fill="#4a5c7d"/>
    <rect x="700" y="368" width="282" height="1.5" fill="#1c2942"/>

    <circle cx="654" cy="430" r="26" fill="#8a6a4a"/>
    <rect x="700" y="410" width="88" height="14" rx="7" fill="#cfd9ea" opacity="0.85"/>
    <rect x="700" y="434" width="244" height="12" rx="6" fill="#7787a4" opacity="0.5"/>
    <circle cx="958" cy="414" r="4" fill="#4a5c7d"/>
    <rect x="700" y="468" width="282" height="1.5" fill="#1c2942"/>

    <circle cx="654" cy="530" r="26" fill="#4a7a6a"/>
    <rect x="700" y="510" width="124" height="14" rx="7" fill="#cfd9ea" opacity="0.85"/>
    <rect x="700" y="534" width="180" height="12" rx="6" fill="#7787a4" opacity="0.5"/>
    <circle cx="958" cy="514" r="4" fill="#4a5c7d"/>
    <rect x="700" y="568" width="282" height="1.5" fill="#1c2942"/>

    <rect x="614" y="620" width="330" height="36" rx="18" fill="#16233c"/>
    <rect x="630" y="633" width="204" height="10" rx="5" fill="#33415f"/>
    <circle cx="930" cy="638" r="15" fill="#3f7ae0"/>
    <path d="M924,638 l4,4 l8,-8" fill="none" stroke="#eaf1fb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
