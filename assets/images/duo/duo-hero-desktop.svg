  <path d="M820 102v16M812 110h16" stroke="#dfe9ff" stroke-width="1.3" opacity="0.45" stroke-linecap="round"/>
  <path d="M1360 52v16M1352 60h16" stroke="#dfe9ff" stroke-width="1.3" opacity="0.4" stroke-linecap="round"/>

