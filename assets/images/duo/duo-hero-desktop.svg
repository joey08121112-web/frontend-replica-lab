    <circle cx="1560" cy="300" r="1.1" opacity="0.24"/>
    <circle cx="240" cy="360" r="0.8" opacity="0.15"/>
    <circle cx="90" cy="420" r="1" opacity="0.2"/>
    <circle cx="170" cy="520" r="1.2" opacity="0.26"/>
    <circle cx="330" cy="470" r="0.8" opacity="0.14"/>
