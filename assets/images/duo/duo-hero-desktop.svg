      <ellipse cx="286" cy="90" rx="4" ry="2.4" fill="#ffffff" opacity="0.4" transform="rotate(-25 286 90)"/>
      <circle cx="296" cy="44" r="9" fill="#e8ddb8" opacity="0.2"/>
      <circle cx="296" cy="44" r="5" fill="#e8ddb8" opacity="0.85"/>
      <circle cx="170" cy="380" r="64" fill="none" stroke="#b9a97f" stroke-width="2" opacity="0.15"/>
      <circle cx="170" cy="380" r="52" fill="none" stroke="#b9a97f" stroke-width="6" opacity="0.6"/>
      <rect x="339.5" y="300" width="6" height="52" rx="3" fill="#0b1322" stroke="#33425c" stroke-width="0.6"/>
      <rect x="339.5" y="368" width="6" height="52" rx="3" fill="#0b1322" stroke="#33425c" stroke-width="0.6"/>
      <rect x="339.5" y="446" width="6" height="84" rx="3" fill="#0b1322" stroke="#33425c" stroke-width="0.6"/>
    </g>
