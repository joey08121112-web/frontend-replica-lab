<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Hero banner with two folded iPhone Duo phones standing at slight angles on a deep night-blue gradient with faint stars, large empty space on the left for a headline">
  <title>iPhone Duo — desktop hero</title>
  <defs>
    <linearGradient id="bgH" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="0.55" stop-color="#131c2c"/>
      <stop offset="1" stop-color="#1a2332"/>
    </linearGradient>
    <radialGradient id="glowH" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#33456b" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#22304d" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22304d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="floorGlowH" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2e4066" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#2e4066" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c3b56"/>
      <stop offset="0.5" stop-color="#1a2332"/>
      <stop offset="1" stop-color="#0f1727"/>
    </linearGradient>
    <linearGradient id="rimH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0e2b8" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#c8b88a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7f8db0" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="sheenH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hingeH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5d6d90"/>
      <stop offset="0.45" stop-color="#28324a"/>
      <stop offset="0.8" stop-color="#4a5a7c"/>
      <stop offset="1" stop-color="#1a2334"/>
    </linearGradient>
    <linearGradient id="scrH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1526"/>
      <stop offset="0.6" stop-color="#070b14"/>
      <stop offset="1" stop-color="#04060c"/>
    </linearGradient>
    <linearGradient id="islH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2a45"/>
      <stop offset="1" stop-color="#0b111e"/>
    </linearGradient>
    <radialGradient id="ringH" cx="0.35" cy="0.3" r="0.95">
      <stop offset="0" stop-color="#93a4c4"/>
      <stop offset="0.55" stop-color="#4a5a7c"/>
      <stop offset="1" stop-color="#232e46"/>
    </radialGradient>
    <radialGradient id="glassH" cx="0.35" cy="0.3" r="0.95">
      <stop offset="0" stop-color="#55688c"/>
      <stop offset="0.55" stop-color="#16202f"/>
      <stop offset="1" stop-color="#04060c"/>
    </radialGradient>
    <clipPath id="scrHClip">
      <rect x="22" y="138" width="296" height="568" rx="27"/>
    </clipPath>
    <linearGradient id="fadeRef" x1="0" y1="816" x2="0" y2="1010" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="refMask">
      <rect x="760" y="816" width="860" height="200" fill="url(#fadeRef)"/>
