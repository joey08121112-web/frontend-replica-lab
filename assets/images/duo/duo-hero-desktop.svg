      <rect x="0" y="0" width="340" height="730" rx="52" fill="url(#sheenH)"/>
      <rect x="0" y="0" width="340" height="730" rx="52" fill="none" stroke="url(#rimH)" stroke-width="2"/>
      <rect x="218" y="24" width="104" height="104" rx="32" fill="url(#islH)" stroke="#465a7c" stroke-width="1"/>
