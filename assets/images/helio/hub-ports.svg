<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" role="img" aria-label="中枢接口特写：电网、光伏、电池与网络">
  <!-- 教学素材：内容示意，不构成站点配色或布局建议 -->
  <rect x="0" y="0" width="600" height="450" fill="#F3F5F8"/>
  <!-- 机身下缘 -->
  <rect x="90" y="60" width="420" height="330" rx="26" fill="#3E4756"/>
  <rect x="108" y="78" width="384" height="294" rx="18" fill="#4A5468"/>
  <!-- 接口区面板 -->
  <rect x="130" y="150" width="340" height="180" rx="14" fill="#2E3646"/>
  <!-- 四组接口 -->
  <g>
    <!-- GRID IN -->
    <circle cx="180" cy="200" r="22" fill="none" stroke="#C9CFD8" stroke-width="4"/>
    <circle cx="180" cy="200" r="9" fill="#C9CFD8"/>
    <rect x="146" y="240" width="68" height="9" rx="4.5" fill="#7A8494"/>
    <path d="M166 216 L156 232 M180 216 L180 234 M194 216 L204 232" stroke="#F0A03C" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g>
    <!-- PV IN -->
    <circle cx="280" cy="200" r="22" fill="none" stroke="#C9CFD8" stroke-width="4"/>
    <circle cx="280" cy="200" r="9" fill="#F0A03C"/>
    <rect x="252" y="240" width="56" height="9" rx="4.5" fill="#7A8494"/>
    <path d="M262 188 L274 200 L262 212 M286 188 L298 200 L286 212" stroke="#F0A03C" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
  <g>
    <!-- BATTERY -->
    <rect x="330" y="182" width="52" height="36" rx="8" fill="none" stroke="#C9CFD8" stroke-width="4"/>
    <rect x="382" y="192" width="8" height="16" rx="3" fill="#C9CFD8"/>
    <rect x="340" y="192" width="24" height="16" rx="3" fill="#F0A03C"/>
    <rect x="328" y="240" width="70" height="9" rx="4.5" fill="#7A8494"/>
  </g>
  <g>
    <!-- LAN -->
    <rect x="418" y="182" width="42" height="36" rx="6" fill="none" stroke="#C9CFD8" stroke-width="4"/>
    <path d="M426 182 L426 170 M438 182 L438 170 M450 182 L450 170" stroke="#C9CFD8" stroke-width="4" stroke-linecap="round"/>
    <rect x="416" y="240" width="46" height="9" rx="4.5" fill="#7A8494"/>
  </g>
  <!-- 通风格栅（顶部） -->
  <g stroke="#5A6373" stroke-width="6" stroke-linecap="round">
    <line x1="150" y1="110" x2="450" y2="110"/>
    <line x1="150" y1="130" x2="450" y2="130"/>
  </g>
  <!-- 底部出线 -->
  <path d="M300 390 L300 418" stroke="#3E4756" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="300" cy="424" rx="70" ry="8" fill="#C9CFD8" opacity="0.6"/>
</svg>
