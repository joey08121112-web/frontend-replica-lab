<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="配电箱与中枢并排挂墙的安装场景示意">
  <!-- 教学素材：内容示意，不构成站点配色或布局建议 -->
  <rect x="0" y="0" width="800" height="600" fill="#F3F5F8"/>
  <line x1="0" y1="540" x2="800" y2="540" stroke="#C9CFD8" stroke-width="3"/>
  <!-- 配电箱 -->
  <rect x="120" y="140" width="240" height="330" rx="14" fill="#FFFFFF" stroke="#7A8494" stroke-width="4"/>
  <rect x="140" y="164" width="200" height="282" rx="8" fill="#EDEFF3"/>
  <!-- 空开排 -->
  <g fill="#3E4756">
    <rect x="158" y="184" width="40" height="34" rx="4"/>
    <rect x="206" y="184" width="40" height="34" rx="4"/>
    <rect x="254" y="184" width="40" height="34" rx="4"/>
    <rect x="158" y="232" width="40" height="34" rx="4"/>
    <rect x="206" y="232" width="40" height="34" rx="4"/>
    <rect x="254" y="232" width="40" height="34" rx="4"/>
    <rect x="158" y="280" width="40" height="34" rx="4"/>
    <rect x="206" y="280" width="40" height="34" rx="4"/>
  </g>
  <rect x="158" y="336" width="164" height="10" rx="5" fill="#C9CFD8"/>
  <rect x="158" y="360" width="120" height="10" rx="5" fill="#C9CFD8"/>
  <!-- 桥架（箱到中枢） -->
  <rect x="360" y="250" width="110" height="26" rx="6" fill="#C9CFD8"/>
  <!-- 中枢（缩小版） -->
  <rect x="470" y="170" width="220" height="290" rx="24" fill="#FFFFFF" stroke="#C9CFD8" stroke-width="3"/>
  <rect x="494" y="196" width="172" height="238" rx="18" fill="#3E4756"/>
  <circle cx="580" cy="272" r="36" fill="#2E3646"/>
  <circle cx="580" cy="272" r="25" fill="none" stroke="#F0A03C" stroke-width="8" stroke-linecap="round" stroke-dasharray="110 48"/>
  <circle cx="580" cy="272" r="9" fill="#F0A03C"/>
  <rect x="522" y="336" width="116" height="9" rx="4.5" fill="#7A8494"/>
  <g stroke="#5A6373" stroke-width="5" stroke-linecap="round">
    <line x1="526" y1="386" x2="634" y2="386"/>
    <line x1="526" y1="404" x2="634" y2="404"/>
  </g>
  <!-- 标签牌 -->
  <rect x="330" y="296" width="70" height="30" rx="8" fill="#FFFFFF" stroke="#C9CFD8" stroke-width="3"/>
  <!-- 地面阴影 -->
  <ellipse cx="400" cy="558" rx="300" ry="12" fill="#C9CFD8" opacity="0.5"/>
</svg>
