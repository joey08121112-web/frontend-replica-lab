<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="傍晚的家庭住宅，窗口透出暖光">
  <!-- 教学素材：内容示意，不构成站点配色或布局建议 -->
  <rect x="0" y="0" width="800" height="560" fill="#2E3646"/>
  <!-- 星与月 -->
  <g fill="#EDEFF3" opacity="0.8">
    <circle cx="120" cy="90" r="3"/>
    <circle cx="220" cy="60" r="2.5"/>
    <circle cx="320" cy="110" r="2"/>
    <circle cx="660" cy="70" r="2.5"/>
    <circle cx="740" cy="140" r="2"/>
    <circle cx="560" cy="50" r="2"/>
  </g>
  <path d="M700 60 a44 44 0 1 0 44 60 a36 36 0 1 1 -44 -60 z" fill="#EDEFF3" opacity="0.9"/>
  <!-- 主体住宅 -->
  <g>
    <rect x="250" y="250" width="320" height="200" fill="#3A4354"/>
    <path d="M225 260 L410 120 L595 260 Z" fill="#33202E" stroke="#3A4354" stroke-width="0"/>
    <path d="M225 260 L410 120 L595 260 Z" fill="#4A5468" opacity="0.55"/>
    <!-- 烟囱 -->
    <rect x="500" y="150" width="34" height="70" fill="#3A4354"/>
    <!-- 暖窗 -->
    <g fill="#F0A03C">
      <rect x="285" y="290" width="60" height="70" rx="5" opacity="0.9"/>
      <rect x="475" y="290" width="60" height="70" rx="5" opacity="0.75"/>
      <rect x="380" y="300" width="56" height="60" rx="5" opacity="0.5"/>
    </g>
    <g stroke="#2E3646" stroke-width="4">
      <line x1="315" y1="290" x2="315" y2="360"/>
      <line x1="285" y1="325" x2="345" y2="325"/>
      <line x1="505" y1="290" x2="505" y2="360"/>
      <line x1="475" y1="325" x2="535" y2="325"/>
    </g>
    <!-- 门 -->
    <rect x="386" y="360" width="48" height="90" rx="6" fill="#242B38"/>
    <circle cx="424" cy="408" r="4" fill="#F0A03C"/>
    <!-- 屋顶光伏（夜色） -->
    <g transform="rotate(-32 410 190)" opacity="0.9">
      <rect x="368" y="176" width="86" height="30" fill="#242B38"/>
      <line x1="396" y1="176" x2="396" y2="206" stroke="#4A5468" stroke-width="2.5"/>
      <line x1="424" y1="176" x2="424" y2="206" stroke="#4A5468" stroke-width="2.5"/>
    </g>
  </g>
  <!-- 车库侧的中枢微光 -->
  <rect x="600" y="380" width="46" height="70" rx="8" fill="#242B38"/>
  <circle cx="623" cy="412" r="10" fill="#F0A03C" opacity="0.9"/>
  <circle cx="623" cy="412" r="18" fill="none" stroke="#F0A03C" stroke-width="2.5" opacity="0.35"/>
  <!-- 地面 -->
  <line x1="0" y1="450" x2="800" y2="450" stroke="#242B38" stroke-width="4"/>
  <rect x="0" y="450" width="800" height="110" fill="#242B38"/>
  <!-- 前路暖光反射 -->
  <ellipse cx="410" cy="500" rx="220" ry="26" fill="#F0A03C" opacity="0.08"/>
</svg>
