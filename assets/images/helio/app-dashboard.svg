<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="App 仪表盘示意：用电卡片与趋势">
  <!-- 教学素材：内容示意，不构成站点配色或布局建议 -->
  <rect x="0" y="0" width="800" height="560" fill="#F3F5F8"/>
  <!-- 手机框 -->
  <rect x="300" y="30" width="240" height="500" rx="36" fill="#FFFFFF" stroke="#3E4756" stroke-width="6"/>
  <rect x="316" y="46" width="208" height="468" rx="24" fill="#F3F5F8"/>
  <!-- 状态栏 -->
  <rect x="336" y="60" width="60" height="8" rx="4" fill="#C9CFD8"/>
  <circle cx="494" cy="64" r="5" fill="#C9CFD8"/>
  <!-- 标题行 -->
  <rect x="336" y="86" width="96" height="12" rx="6" fill="#7A8494"/>
  <rect x="444" y="86" width="40" height="12" rx="6" fill="#F0A03C"/>
  <!-- 主卡片：当前节省 -->
  <rect x="336" y="116" width="168" height="96" rx="14" fill="#3E4756"/>
  <rect x="352" y="132" width="56" height="9" rx="4.5" fill="#7A8494"/>
  <rect x="352" y="152" width="96" height="22" rx="8" fill="#F0A03C"/>
  <rect x="352" y="186" width="72" height="9" rx="4.5" fill="#5A6373"/>
  <!-- 实时功率卡 -->
  <rect x="336" y="228" width="78" height="64" rx="12" fill="#FFFFFF" stroke="#C9CFD8" stroke-width="3"/>
  <circle cx="358" cy="248" r="8" fill="#F0A03C" opacity="0.8"/>
  <rect x="348" y="264" width="46" height="8" rx="4" fill="#C9CFD8"/>
  <rect x="426" y="228" width="78" height="64" rx="12" fill="#FFFFFF" stroke="#C9CFD8" stroke-width="3"/>
  <circle cx="448" cy="248" r="8" fill="#7A8494" opacity="0.7"/>
  <rect x="438" y="264" width="46" height="8" rx="4" fill="#C9CFD8"/>
  <!-- 趋势折线卡 -->
  <rect x="336" y="308" width="168" height="104" rx="14" fill="#FFFFFF" stroke="#C9CFD8" stroke-width="3"/>
  <polyline points="352,392 372,368 390,380 410,344 430,356 450,330 472,344 490,322"
    fill="none" stroke="#F0A03C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="490" cy="322" r="5" fill="#F0A03C"/>
  <!-- 高峰条 -->
  <rect x="336" y="428" width="168" height="42" rx="12" fill="#FFFFFF" stroke="#C9CFD8" stroke-width="3"/>
  <rect x="352" y="444" width="88" height="10" rx="5" fill="#C9CFD8"/>
  <rect x="452" y="440" width="36" height="18" rx="9" fill="#F0A03C" opacity="0.7"/>
  <!-- 底部 tab -->
  <g fill="#C9CFD8">
    <circle cx="396" cy="496" r="6"/>
    <circle cx="424" cy="496" r="6" fill="#F0A03C"/>
    <circle cx="452" cy="496" r="6"/>
  </g>
  <!-- 环境提示（左右淡影） -->
  <circle cx="150" cy="280" r="90" fill="#EDEFF3"/>
  <circle cx="680" cy="180" r="60" fill="#EDEFF3"/>
  <circle cx="660" cy="430" r="36" fill="#EDEFF3"/>
</svg>
