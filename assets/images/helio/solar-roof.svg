<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" role="img" aria-label="屋顶光伏板与太阳示意">
  <!-- 教学素材：内容示意，不构成站点配色或布局建议 -->
  <rect x="0" y="0" width="600" height="450" fill="#F3F5F8"/>
  <!-- 太阳 -->
  <circle cx="120" cy="100" r="42" fill="#F0A03C"/>
  <g stroke="#F0A03C" stroke-width="6" stroke-linecap="round">
    <line x1="120" y1="30" x2="120" y2="52"/>
    <line x1="190" y1="100" x2="168" y2="100"/>
    <line x1="50" y1="100" x2="72" y2="100"/>
    <line x1="170" y1="50" x2="155" y2="65"/>
    <line x1="70" y1="150" x2="85" y2="135"/>
  </g>
  <!-- 屋面（斜面） -->
  <path d="M80 380 L340 180 L560 260 L420 420 Z" fill="#FFFFFF" stroke="#3E4756" stroke-width="5"/>
  <!-- 光伏板 2x3 -->
  <g transform="rotate(-9 320 300)">
    <g fill="#4E5D73" stroke="#EDEFF3" stroke-width="3">
      <rect x="200" y="240" width="80" height="52" rx="3"/>
      <rect x="290" y="240" width="80" height="52" rx="3"/>
      <rect x="380" y="240" width="80" height="52" rx="3"/>
      <rect x="200" y="302" width="80" height="52" rx="3"/>
      <rect x="290" y="302" width="80" height="52" rx="3"/>
      <rect x="380" y="302" width="80" height="52" rx="3"/>
    </g>
    <!-- 高光 -->
    <path d="M212 250 L268 284" stroke="#7A8494" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <path d="M402 312 L448 284" stroke="#7A8494" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  </g>
  <!-- 屋檐阴影 -->
  <path d="M80 380 L340 180 L360 194 L104 392 Z" fill="#EDEFF3"/>
  <line x1="0" y1="420" x2="600" y2="420" stroke="#C9CFD8" stroke-width="3"/>
</svg>
