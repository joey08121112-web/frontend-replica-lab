<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-label="24 小时用电曲线示意，晚高峰时段高亮">
  <!-- 教学素材：内容示意，不构成站点配色或布局建议 -->
  <rect x="0" y="0" width="800" height="480" fill="#F3F5F8"/>
  <!-- 晚高峰高亮带（18:00–21:00） -->
  <rect x="540" y="90" width="105" height="310" fill="#F0A03C" opacity="0.16"/>
  <!-- 网格 -->
  <g stroke="#C9CFD8" stroke-width="2" stroke-dasharray="2 8">
    <line x1="90" y1="150" x2="740" y2="150"/>
    <line x1="90" y1="230" x2="740" y2="230"/>
    <line x1="90" y1="310" x2="740" y2="310"/>
  </g>
  <!-- 坐标轴 -->
  <line x1="90" y1="90" x2="90" y2="400" stroke="#7A8494" stroke-width="4" stroke-linecap="round"/>
  <line x1="90" y1="400" x2="740" y2="400" stroke="#7A8494" stroke-width="4" stroke-linecap="round"/>
  <!-- 曲线：夜低 / 早峰 / 日间回落 / 晚尖峰 -->
  <path d="M90 372 C130 368 150 340 180 316 C210 292 240 300 270 330 C300 360 330 366 360 350
           C390 334 420 300 450 296 C480 292 510 320 540 300 C560 286 570 240 592 196
           C610 162 630 150 648 168 C664 184 668 232 682 280 C694 322 710 356 740 368"
        fill="none" stroke="#F0A03C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 晚尖峰点 -->
  <circle cx="630" cy="158" r="10" fill="#F0A03C"/>
  <circle cx="630" cy="158" r="18" fill="none" stroke="#F0A03C" stroke-width="3" opacity="0.4"/>
  <!-- 深夜基线（电池调度前对比，虚线） -->
  <path d="M90 372 C200 360 320 356 440 344 C540 334 620 330 740 334"
        fill="none" stroke="#7A8494" stroke-width="4" stroke-dasharray="2 12" stroke-linecap="round"/>
  <!-- 轴刻度 -->
  <g stroke="#7A8494" stroke-width="4" stroke-linecap="round">
    <line x1="90" y1="400" x2="90" y2="408"/>
    <line x1="255" y1="400" x2="255" y2="408"/>
    <line x1="420" y1="400" x2="420" y2="408"/>
    <line x1="585" y1="400" x2="585" y2="408"/>
    <line x1="740" y1="400" x2="740" y2="408"/>
  </g>
  <!-- 高峰图例 -->
  <rect x="556" y="108" width="18" height="18" rx="4" fill="#F0A03C" opacity="0.4"/>
  <rect x="580" y="110" width="52" height="12" rx="6" fill="#7A8494"/>
</svg>
