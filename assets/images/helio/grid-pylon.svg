    <rect x="235" y="130" width="10" height="24" rx="4"/>
    <rect x="342" y="190" width="10" height="24" rx="4"/>
    <rect x="178" y="250" width="10" height="24" rx="4"/>
    <rect x="292" y="250" width="10" height="24" rx="4"/>
  </g>
  <!-- 电线 -->
  <g stroke="#3E4756" stroke-width="4" fill="none">
    <path d="M0 240 C60 260 90 250 128 216"/>
    <path d="M352 216 C420 250 480 258 600 236"/>
    <path d="M0 330 C90 344 160 330 188 276"/>
    <path d="M292 276 C340 330 460 344 600 328"/>
