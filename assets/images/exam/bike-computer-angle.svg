<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Vector Trail cycling computer, three-quarter angle view with buttons and out-front mount">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f9fa"/>
      <stop offset="1" stop-color="#e3e6e9"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#353c44"/>
      <stop offset="0.55" stop-color="#22272d"/>
      <stop offset="1" stop-color="#13161a"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111519"/>
      <stop offset="1" stop-color="#06080a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#0d1318"/>
      <stop offset="1" stop-color="#070a0c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <g font-family="Arial, sans-serif">
    <!-- ground shadow -->
    <ellipse cx="402" cy="524" rx="198" ry="15" fill="#0a0d10" opacity="0.09"/>
    <!-- right side face (edge band, tangent to rounded corners) -->
    <path d="M477.9,169 L505.9,169 L526.9,423.1 L498.9,423.1 Z" fill="#14181e"/>
    <path d="M477.9,169 L484.9,169 L505.9,423.1 L498.9,423.1 Z" fill="#222932"/>
    <!-- front face group (perspective transform) -->
    <g transform="matrix(0.88 -0.10 0.08 0.97 264 160)">
      <!-- side buttons -->
      <rect x="-10" y="98" width="13" height="36" rx="5" fill="#0f1319"/>
      <rect x="-10" y="142" width="13" height="36" rx="5" fill="#0f1319"/>
      <rect x="237" y="106" width="13" height="44" rx="5" fill="#0f1319"/>
      <rect x="237" y="158" width="13" height="40" rx="5" fill="#0f1319"/>
      <!-- out-front mount -->
      <rect x="66" y="326" width="108" height="26" rx="9" fill="#20262c"/>
      <rect x="48" y="348" width="144" height="26" rx="10" fill="#272d34"/>
      <rect x="54" y="352" width="132" height="3" rx="1.5" fill="#3d454e" opacity="0.5"/>
      <rect x="114" y="354" width="12" height="15" rx="4" fill="#141920"/>
      <!-- body -->
      <rect x="0" y="0" width="240" height="330" rx="34" fill="url(#body)"/>
      <rect x="1" y="1" width="238" height="328" rx="33" fill="none" stroke="#4e575f" stroke-opacity="0.45" stroke-width="1.4"/>
      <rect x="9" y="9" width="222" height="312" rx="26" fill="#1b2026" opacity="0.85"/>
      <text x="120" y="27" text-anchor="middle" font-size="9" letter-spacing="2.5" fill="#9aa4ad">VECTOR TRAIL</text>
      <!-- screen -->
      <rect x="24" y="38" width="192" height="262" rx="14" fill="url(#bezel)"/>
      <rect x="31" y="45" width="178" height="248" rx="10" fill="url(#glass)"/>
      <!-- status bar -->
      <rect x="39" y="59" width="4" height="5" fill="#71d144"/>
      <rect x="45" y="56" width="4" height="8" fill="#71d144"/>
      <rect x="51" y="53" width="4" height="11" fill="#71d144"/>
      <rect x="57" y="50" width="4" height="14" fill="#71d144"/>
      <text x="66" y="62" font-size="9" fill="#71d144">GPS</text>
      <rect x="168" y="51" width="25" height="11" rx="2" fill="none" stroke="#8a949c" stroke-width="1.2"/>
      <rect x="170.5" y="53.5" width="16" height="6" fill="#71d144"/>
      <rect x="194.5" y="54" width="2.5" height="5" fill="#8a949c"/>
      <rect x="33" y="68" width="174" height="1" fill="#1c232a"/>
      <!-- speed hero -->
      <text x="39" y="88" font-size="9.5" letter-spacing="1" fill="#8a949c">SPD</text>
      <text x="120" y="136" text-anchor="middle" font-size="44" font-weight="bold" fill="#f2f5f7">34.6</text>
      <text x="120" y="154" text-anchor="middle" font-size="10" letter-spacing="1" fill="#8a949c">KM/H</text>
      <!-- 2x2 data grid -->
      <rect x="119.5" y="164" width="1" height="78" fill="#1c232a"/>
      <rect x="33" y="204" width="174" height="1" fill="#1c232a"/>
      <text x="39" y="182" font-size="9" letter-spacing="1" fill="#8a949c">HR</text>
      <text x="39" y="199" font-size="19" font-weight="bold" fill="#ff4b3e">152</text>
      <text x="129" y="182" font-size="9" letter-spacing="1" fill="#8a949c">PWR</text>
      <text x="129" y="199" font-size="19" font-weight="bold" fill="#f2f5f7">248</text>
      <text x="168" y="199" font-size="9" fill="#8a949c">W</text>
      <text x="39" y="222" font-size="9" letter-spacing="1" fill="#8a949c">CAD</text>
      <text x="39" y="239" font-size="19" font-weight="bold" fill="#f2f5f7">88</text>
      <text x="68" y="239" font-size="9" fill="#8a949c">RPM</text>
      <text x="129" y="222" font-size="9" letter-spacing="1" fill="#8a949c">DIST</text>
      <text x="129" y="239" font-size="19" font-weight="bold" fill="#f2f5f7">42.7</text>
      <text x="176" y="239" font-size="9" fill="#8a949c">KM</text>
      <!-- bottom bar -->
      <rect x="33" y="246" width="174" height="1" fill="#1c232a"/>
      <text x="39" y="274" font-size="12" fill="#e8ecef">10:38</text>
      <circle cx="176" cy="270" r="2.5" fill="#71d144"/>
      <circle cx="185" cy="270" r="2.5" fill="#39434c"/>
      <circle cx="194" cy="270" r="2.5" fill="#39434c"/>
      <!-- faint glass sheen -->
      <path d="M31,45 L75,45 L52,293 L31,293 Z" fill="#ffffff" opacity="0.03"/>
    </g>
  </g>
</svg>
